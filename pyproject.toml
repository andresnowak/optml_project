[project]
name = "optml-project"
version = "0.1.0"
description = "Optimizer convergence benchmarks for small PyTorch problems."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.9<2.11",
  "matplotlib",
  "wandb>=0.26.1",
  "jupyter>=1.1.1",
  "pytest>=9.0.3",
  "metalcore",
]

[tool.uv]
package = false

[tool.uv.sources]
metalcore = { git = "https://github.com/myfykris/metalcore", subdirectory = "packages/metalcore", rev = "4b6ffe6c1cf2bc6e8dbd9c7f9d0ee5ecbdaf79be" }
