[project]
name = "optml-project"
version = "0.1.0"
description = "Optimizer convergence benchmarks for small PyTorch problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "matplotlib",
]

[project.scripts]
optml-bench = "optml_project.cli:main"

[tool.uv]
package = true
