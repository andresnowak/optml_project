# Track-3-inspired GPT at the reference 12-layer / 768-dim scale.
extends: base.yaml

model: gpt124m
model_dim: 768
n_layer: 12
n_head: 6
sequence_length: 1024

# Token accounting for current WikiText-103 cache:
#   train.bin: 117,920,141 GPT-2-BPE tokens
#   val.bin:      247,290 GPT-2-BPE tokens
#
# Batching:
#   batch_size is sequences per optimizer step.
#   mbs is sequences per microbatch.
#   tokens/step = batch_size * sequence_length.
# Current values:
#   256 sequences/step * 1,024 tokens = 262,144 tokens/step.
#   4 microbatches/step of 64 sequences each.
#   one train-token pass ~= 117,920,141 / 262,144 = 449.8 optimizer steps.
#   3,125 steps = 819,200,000 train tokens ~= 6.95 train-token passes.
#   validation requests 10,485,760 tokens but is capped to the tiny val split
#   (247,290 tokens, rounded to full 1,024-token sequences by the trainer).
batch_size: 256
mbs: 64
train_steps: 3125
val_tokens: 10485760
val_loss_every: 125
