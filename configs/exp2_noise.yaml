# Experiment 2 — anisotropic noise injection. The script runs this config twice
# (global_schedule vs stable_rank) with the noise hook active and compares loss /
# p-trajectory stability.
extends: small.yaml

# 300 steps ~= 0.042 WikiText epochs with small.yaml batching.
train_steps: 300
val_loss_every: 300
log_every: 5
noise_lambda: 3.0
