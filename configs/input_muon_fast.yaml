# InputMuon fast ablation without matrix weight decay.
#
# Same optimizer idea as input_muon.yaml, but with cheaper basis refreshes. The
# slow path is the per-layer activation SVD used to build Q, not the projected
# Muon update itself.
extends: input_muon.yaml
run_name: input_muon_fast_no_wd

ns_steps: 5
input_muon_rank: 32
input_muon_update_every: 10
input_muon_basis_max_tokens: 512
input_muon_center: false
