extends: shakespeare.yaml

# SpecMuon tail-mode ablation on tinyshakespeare.
# Sweep with:
#   --sweep top_k=0,6,32 --sweep tail_mode=gradient,muon

optimizer: specmuon
lr: 3.0e-4
weight_decay: 0.0
batch_size: 128
steps: 3000
log_every: 20

adjust_lr_fn: shape_scaling
backend: wandb
wandb_project: mlo-specmuon-shakespeare
log_sav_r: true
