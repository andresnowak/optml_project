# Shared defaults. Model-specific configs `extends: base.yaml` and override.
# Every run knob lives here — nothing is hard-coded in the Python.

device: auto
seed: 0
mlp: gelu                  # gelu | gated
data_dir: data/wikitext103

# method
matrix_optimizer: dynmuon  # dynmuon (DynMuonRoute on matrices) | adamw (AdamW baseline)
routing_mode: stable_rank  # fixed | global_schedule | stable_rank | snr | alignment
fixed_p: 0.0               # used when routing_mode=fixed (0.0 = Muon, 1.0 = SGD)
compute_mode: ns           # ns (fast Newton-Schulz/eigen) | svd (exact)
ns_variant: quintic        # quintic (reference DynMuon) | cubic (textbook)
ns_steps: 5                # cubic iterations (quintic is fixed at 5)
# global_schedule logistic (reference DynMuon get_p): p drops 1 -> -0.25
tau_ratio: 0.04            # schedule center (fraction of total steps)
width_ratio: 0.04          # schedule width

# optimization
momentum: 0.95
nesterov: true
adjust_lr_fn: spectral_norm   # sqrt(fan_out/fan_in); null disables
muon_lr: 0.02              # DynMuon-Route matrices
adam_lr: 6.0e-4           # embeddings / norms / biases
weight_decay: 0.1

# schedule
min_lr_ratio: 0.1
grad_clip: 1.0

# logging / eval
log_every: 10
eval_iters: 50
wandb: false
wandb_project: dynmuon-route

# experiment 2 — anisotropic noise injection (0 disables)
noise_lambda: 0.0

# Per-(routing_mode, layer_type) routing logistic:
#   p = p_min + (p_max-p_min) / (1 + exp(-(x - mu)/omega))
# Proxies are scale-invariant (stable rank is normalized by d), so these values
# are model-agnostic. omega > 0 => p increases with x; omega < 0 => decreases.
# Per layer type we give attention a lower center than MLP so attention resists
# negative p (stays p >= 0) while MLP routes toward p = -0.25 at low stable rank.
route:
  stable_rank:               # x = sr/d in (0, 1]; high => isotropic => p >= 0
    attn:    {mu: 0.35, omega: 0.12}
    mlp:     {mu: 0.60, omega: 0.12}
    default: {mu: 0.50, omega: 0.12}
  snr:                       # x = gamma in [0, inf); low (noisy) => p >= 0 (omega < 0)
    default: {mu: 1.5, omega: -0.5}
  alignment:                 # x = alpha in [0, 1]; high => p -> 1
    default: {mu: 0.3, omega: 0.1}
